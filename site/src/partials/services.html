<!-- Services: 2-column cell grid (an odd last cell spans the full width) -->
<section class="w sec2" id="sx-services">
  <div class="top">
    <div>
      <p class="m lab">{{services.kicker}}</p>
      <h2 class="d">{{services.title}}</h2>
    </div>
    <p class="mu m-hide">{{services.intro}}</p>
  </div>
  <div class="grid">
    {{#each services.items}}
    <div class="cell">
      <h3 class="d">{{title}}</h3>
      <p class="mu">{{desc}}</p>
    </div>
    {{/each}}
  </div>
</section>
